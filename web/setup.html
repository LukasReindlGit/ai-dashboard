<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Ops · Setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230176D3'/%3E%3Cpath d='M9 21a4 4 0 0 1 .6-7.95A5.5 5.5 0 0 1 20 11.5a4.5 4.5 0 0 1 3 9.5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root { --brand:#0176D3; --brand-dark:#014486; --navy:#032D60; --cloud:#1B96FF; --err:#BA0517; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font-family: "Salesforce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1B96FF55, transparent 60%),
                radial-gradient(900px 500px at 110% 110%, #0176D388, transparent 60%),
                linear-gradient(160deg, #032D60 0%, #014486 55%, #0176D3 100%);
    color: #181818;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(3,45,96,.45); overflow: hidden;
  }
  .top { padding: 28px 28px 8px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 14px; }
  h1 { margin: 0; font-size: 22px; color: var(--navy); letter-spacing: -.01em; }
  p { margin: 6px 0 0; color: #5c5c5c; font-size: 14px; }
  form { padding: 20px 28px 28px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 15px; border: 1px solid #C9C9C9; border-radius: 6px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input + label { margin-top: 14px; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #1B96FF33; }
  button {
    margin-top: 16px; width: 100%; padding: 11px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
  }
  button:hover { background: var(--brand-dark); }
  .step { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .04em; }
  .hint { margin: 0 0 14px; font-size: 13px; line-height: 1.45; }
  .hint code, .secret { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #F3F3F3; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .secret { display: block; padding: 8px 10px; margin: -6px 0 16px; font-size: 13px; word-break: break-all; user-select: all; }
  .qr { width: 200px; margin: 0 auto 14px; }
  .qr svg { display: block; width: 100%; height: auto; }
  label small { font-weight: 400; color: #777; }
  .err { margin: 0 28px; padding: 10px 12px; border-radius: 6px; background: #FDDDE3; color: var(--err); font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <svg class="logo" viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="14" fill="#0176D3"/>
        <path d="M16 37a7 7 0 0 1 1-13.9A9.6 9.6 0 0 1 35 20a7.9 7.9 0 0 1 5.2 17z" fill="#fff"/>
        <circle cx="23" cy="31" r="2.2" fill="#0176D3"/><circle cx="29" cy="31" r="2.2" fill="#0176D3"/><circle cx="35" cy="31" r="2.2" fill="#0176D3"/>
      </svg>
      <h1>AI Ops</h1>
      <p>First-time setup</p>
    </div>
    {{ERROR}}
    <form method="post" action="{{BASE}}/setup">
      {{BODY}}
    </form>
  </div>
</body>
</html>
